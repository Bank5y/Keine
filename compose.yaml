services:
  keine:
    build: .
    ports:
      - "8080:8080"
    environment:
      KEINE_DATABASE_URL: postgres://keine:keine@postgres:5432/keine?sslmode=disable
      KEINE_ADMIN_USERNAME: ${KEINE_ADMIN_USERNAME:-admin}
      KEINE_ADMIN_PASSWORD: ${KEINE_ADMIN_PASSWORD:?set KEINE_ADMIN_PASSWORD (at least 8 characters)}
    volumes:
      - keine-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: keine
      POSTGRES_PASSWORD: keine
      POSTGRES_DB: keine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keine"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  keine-data:
  postgres-data:
