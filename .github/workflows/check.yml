name: check

on:
  push:
    branches: [main]
  pull_request:

# a newer push to a pull request cancels its run still going; each push to
# main has a group of its own, so none of those is cancelled
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # stylelint (a selector defined twice) and oxlint (hook rules)
      - run: npm run lint
        working-directory: web
      - run: npm test
        working-directory: web
      # typecheck, then build into internal/web/dist, which the Go binary embeds
      - run: npm run build
        working-directory: web

  # needs nothing of web: no test reads the front end, which only the keine
  # binary embeds, so a placeholder lets it compile
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the API must behave the same on either storage backend
        storage: [local, s3]
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p internal/web/dist && touch internal/web/dist/.gitkeep
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: matrix.storage == 'local'
        run: test -z "$(gofmt -l cmd internal)" || { gofmt -l cmd internal; exit 1; }
      - run: go vet ./...
        if: matrix.storage == 'local'
      # Postgres (and RustFS for s3) run in containers via testcontainers
      - run: go test ./...
        env:
          KEINE_TEST_STORAGE: ${{ matrix.storage }}
